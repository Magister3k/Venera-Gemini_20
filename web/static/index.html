<!DOCTYPE html>
<html>
<head>
    <title>Venera Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .process { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .status-running { color: green; font-weight: bold; }
        .status-stopped { color: orange; font-weight: bold; }
        .status-error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Панель управления Venera</h1>
    <div id="processes">Загрузка...</div>

    <script>
        async function loadProcesses() {
            try {
                const response = await fetch('/api/processes');
                const procs = await response.json();
                const container = document.getElementById('processes');
                container.innerHTML = '';
                
                procs.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'process';
                    div.innerHTML = `
                        <h3>${p.Name} (${p.ID})</h3>
                        <p>Тип: ${p.Type}</p>
                        <p>Статус: <span class="status-${p.Status}">${p.Status}</span></p>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                document.getElementById('processes').innerText = 'Ошибка загрузки данных';
            }
        }

        setInterval(loadProcesses, 2000);
        loadProcesses();
    </script>
</body>
</html>
